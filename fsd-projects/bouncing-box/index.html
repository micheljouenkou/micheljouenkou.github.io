<!DOCTYPE html>
<html>
 <head>
   <meta charset="utf-8" />
   <title>Bouncing Box</title>
   <script src="jquery.min.js"></script>
   <style>
      body  {
         background-image: url("../../images/bouncingboxbackground.jpg");
         background-color: #cccccc;
     }
     .box {
       width: 70px;
       height: 70px;
       background-color: teal;
       font-size: 300%;
       text-align: center;
       user-select: none;
       display: block;
       position: absolute;
       top: 100px;
       left: 0px;
     }
     .board {
       height: 100vh;
     }
   </style>
 </head>

 <body class="board">
   <div class="box">?</div>

   <script>
     (function () {
       "use strict";
       /* global jQuery */

       // SETUP DO NOT DELETE
       var box = jQuery(".box");
       var board = jQuery(".board");
       var boardWidth = board.width();

       jQuery(window).on("resize", function () {
         boardWidth = board.width();
         boardHeight = jQuery(window).height();
       });

       setInterval(update, 50);
       box.on("click", handleBoxClick);

       function moveBoxTo(newPositionX, newPositionY) {
         box.css("left", newPositionX);
         box.css("top", newPositionY);
       }

       function changeBoxText(newText) {
         box.text(newText);
       }

       // YOUR CODE BELOW HERE
       var positionX = 0;
       var positionY = 100;
       var points = 0;
       var speed = 20;
       var speedY = 20;
       var boardHeight = jQuery(window).height();

       function update() {
         moveBoxTo(positionX, positionY);
         positionX = positionX + speed;
         positionY = positionY + speedY;

         if (positionX > boardWidth || positionX < 0) {
           speed *= -1;
         }
         if (positionY > boardHeight - 70 || positionY < 0) {
           speedY *= -1;
         }
       }

       function handleBoxClick() {
         positionX = 0;
         positionY = 100;
         points++;
         speed = 3 * points + 10;
         speedY = 3 * points + 10;
         changeBoxText(points);
       }

     })();
   </script>
 </body>
</html>
